name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Static checks
        run: bash scripts/static-smoke.sh

      - name: Build Hadoop image
        run: docker build --target hadoop -t bigdata-lab/hadoop-lite:3.4.2 docker/runtime

      - name: Smoke Hadoop runtime
        run: docker run --rm --entrypoint hadoop bigdata-lab/hadoop-lite:3.4.2 version

      - name: Build Spark image
        run: docker build --target spark -t bigdata-lab/spark-lite:3.5.7 docker/runtime

      - name: Smoke Spark runtime
        run: docker run --rm --entrypoint spark-submit bigdata-lab/spark-lite:3.5.7 --version

      - name: Build Hive PostgreSQL image
        run: docker build -t bigdata-lab/hive-postgres:4.2.1 docker/hive-postgres

      - name: Smoke Hive runtime
        run: docker run --rm --entrypoint beeline bigdata-lab/hive-postgres:4.2.1 --version

      - name: Show resulting images
        run: docker image ls 'bigdata-lab/*'
